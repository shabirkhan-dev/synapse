# CI: split quality gates (lint, typecheck, build, test, API + pgvector).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install lint runtime
        run: sudo apt-get update && sudo apt-get install -y shellcheck ripgrep

      - name: Lint and boundaries
        run: bun run ci:lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run ci:typecheck

  build:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run ci:build

  test:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run ci:test
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the version; rustup on the runner installs it on first use.
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Builds crates/bindings and runs the native tests with it: exact o200k_base parity with
      # js-tiktoken on the eval corpus (they are skipped in jobs without the binding).
      - name: Native binding tests
        run: bun --cwd=packages/native run build:native && bun --cwd=packages/native test

  api:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/package.json') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter api --filter worker --filter @synapse/database

      # Unit tests mock the LLM and embeddings; the pgvector integration test uses the service above.
      - name: Test (with pgvector integration)
        working-directory: apps/api
        run: bun test --coverage
        env:
          API_TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/api_test

      # Migrations under an advisory lock: two runners on a fresh database apply each one once.
      - name: Database test (migration lock)
        working-directory: packages/database
        run: bun test
        env:
          API_TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/api_test

      # Re-embed resume-after-crash, real pg-boss delivery, pruning.
      - name: Worker test (with Postgres)
        working-directory: apps/worker
        run: bun test --coverage
        env:
          API_TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/api_test

      - name: Build
        working-directory: apps/api
        run: bun run build

      - name: Boot smoke test
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/api_test
          PORT: "8000"
        run: |
          bun dist/migrate.js
          bun dist/server.js &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/api/v1/health/ready && exit 0
            sleep 1
          done
          exit 1

      - name: Worker boot smoke test
        working-directory: apps/worker
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/api_test
          LOG_FORMAT: json
        run: |
          bun run build
          bun dist/worker.js > worker.log 2>&1 &
          for i in $(seq 1 20); do
            grep -q "worker started" worker.log && kill -TERM $! && exit 0
            sleep 1
          done
          cat worker.log
          exit 1

      # Real retrieval stack (pgvector + full-text + RRF) with offline hashing embeddings; fails when
      # recall@k or MRR drops below packages/evaluation/baselines by more than the tolerance.
      - name: Retrieval evaluation (regression vs baseline)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/api_test
        run: bun run eval:retrieval

      # Same cases with the offline term-overlap reranker: gates the reranking step (candidates,
      # reorder, fallback) against its own baseline. Measuring Cohere needs EVAL_RERANKER=cohere + a key.
      - name: Retrieval evaluation with reranking (regression vs baseline)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/api_test
          EVAL_RERANKER: term-overlap
        run: bun run eval:retrieval

