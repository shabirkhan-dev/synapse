[workspace]
resolver = "3"
members = ["crates/text-processing", "crates/bindings"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
