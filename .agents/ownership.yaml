version: 1

# A card may narrow these paths but may not widen them without human approval. The backend is one
# accountable role; auth, domain, RAG, and migrations are card-level focus areas.
policy:
  default: deny-unowned-writes
  read_access: broad-for-understanding
  write_access: card-scope-only

roles:
  backend:
    team: backend
    paths:
      - apps/api/**
      - crates/**
      - packages/native/**
    reviewers:
      - reviewer
      - qa
  web:
    team: web
    paths:
      - apps/console/**
    reviewers:
      - reviewer
      - qa
      - ui-ux
  qa:
    team: quality
    mode: read-only
    paths: []
    reviewers:
      - reviewer
  reviewer:
    team: quality
    mode: read-only
    paths: []
    reviewers:
      - human
  ui-ux:
    team: design
    paths:
      - packages/ui/**
    reviewers:
      - reviewer
      - web
  pm:
    team: product
    operator: codex
    final_approver: human
    paths:
      - .agents/board/**
      - .agents/plans/**
    reviewers:
      - human

shared:
  api-contract:
    # The OpenAPI document is generated from these route schemas (served at /api/openapi.json).
    paths:
      - apps/api/src/modules/**/*.routes.ts
      - apps/api/src/modules/**/*.schemas.ts
    writers:
      - backend
    reviewers:
      - reviewer
      - web
  project-policy:
    paths:
      - .agents/agent-contract.md
      - .agents/roles/**
      - .agents/ownership.yaml
    writers:
      - human
    reviewers:
      - human
  coordination:
    paths:
      - .agents/board/**
      - .agents/notes/**
    policy: Follow `.agents/README.md`; agents may update their own card lifecycle or owned note.
