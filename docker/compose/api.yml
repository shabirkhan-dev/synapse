# Bun + Hono API (RAG on pgvector, streaming tool chat) — included from root docker-compose.yml
services:
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: synapse-api:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8000
      SERVICE_NAME: synapse-api
      DATABASE_URL: postgresql://${POSTGRES_USER:-synapse}:${POSTGRES_PASSWORD:-synapse}@postgres:5432/${POSTGRES_DB:-synapse}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
      # HS256 secret the API uses to verify access tokens.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_SESSION_TTL_DAYS: ${AUTH_SESSION_TTL_DAYS:-30}
      APP_URL: ${APP_URL:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY in .env (production requires it)}
      EMAIL_FROM: ${EMAIL_FROM:-Synapse <onboarding@resend.dev>}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
      AI_PROVIDER_NAME: ${AI_PROVIDER_NAME:-openrouter}
      AI_API_KEY: ${AI_API_KEY:?Set AI_API_KEY in .env (OpenRouter or any OpenAI-compatible key)}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-openai/gpt-4o-mini}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-openai/text-embedding-3-small}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
      RAG_SEARCH_MODE: ${RAG_SEARCH_MODE:-hybrid}
      RAG_MAX_CONTEXT_TOKENS: ${RAG_MAX_CONTEXT_TOKENS:-3000}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      AI_MODEL_PRICES: ${AI_MODEL_PRICES:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
